<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>From Register</title>
</head>
<body>
    <h2>Registrasi</h2>
    <from action="#">
        <label for type="text">name=Nama Lengkap:</label>
        <input type="text" nama="nama_lengkap" id="nama_lengkap"
        placeholder="Masukan Nama Lengkap">

        <label for ="username">Username:</label>
        <input type="text" nama="username" id="username"
        placeholder="Masukan Username">

        <label for ="email">Email</label>
        <input type="email" nama="email" id="email"
        placeholder="Masukan Email">
        
        <label for ="password">Password</label>
        <input type="password" nama="password" id="password"
        placeholder="Masukan password">

        <label for ="konfrim_password">konfrimasi Password</label>
        <input type="password" nama="password" id="password"
        placeholder="Masukan Kembali Password">

        <label for ="Tanggal_Lahir">Tanggal Lahir</label>
        <input type="data" nama="tanggal_lahir" id="Tanggal_Lahir">
        
        <label for ="jenis_Kelamin">Jenis Kelamin</label>
        <input type="radio" nama="jenis_Kelamin" id="laki-laki"
        value="Laki-laki">
        <label for="laki-laki">Laki-laki</label>

        <input type="radio" nama="jenis_Kelamin" id="perempuan"
        value="Perempuan">
        <label for="perempuan">Perempuan</label>

        <!-- Drop Down pilihan kelas -->
        <label for="kelas">Kelas</label>
        <select new="kelas" id="kelas">
            <option value="XI PPLG 3"></option>
            <option value="XI PPLG 4"></option>
            <option value="XI PPLG 5"></option>
        </select>
        
        <button type="submit">Daftar</button>
        <p>Sudah Memiliki Akun
            <a href="index.html">Login Disini</a>
        </p>
    </from>
</body>
</html>
